services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///data/conference.db
      STORAGE_LOCAL_DIR: /data/uploads
      PUBLIC_MEDIA_BASE_URL: http://localhost:8787/media
    ports: ["8787:8787"]
    volumes: [conference-data:/data]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///data/conference.db
    volumes: [conference-data:/data]
    depends_on: [api]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: http://localhost:8787
    environment:
      API_BASE_URL: http://localhost:8787
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  conference-data:
