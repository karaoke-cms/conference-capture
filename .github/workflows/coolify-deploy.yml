name: Coolify autodeploy

# Coolify GitHub App on tautai is a stub, so the platform webhook never fires.
# Forward GitHub push payloads to Coolify's manual GitHub webhook (HMAC).
on:
  push:
    branches: [main]

jobs:
  notify-coolify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          COOLIFY_WEBHOOK_URL: https://coolify.tautai.tech/webhooks/source/github/events/manual
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const raw = fs.readFileSync('.github/coolify-webhook.env', 'utf8');
            const secretLine = raw.split(/\r?\n/).find((l) => l.startsWith('COOLIFY_WEBHOOK_SECRET='));
            if (!secretLine) throw new Error('COOLIFY_WEBHOOK_SECRET missing from .github/coolify-webhook.env');
            const secret = secretLine.slice('COOLIFY_WEBHOOK_SECRET='.length).trim();
            const body = JSON.stringify(context.payload);
            const hmac = crypto.createHmac('sha256', secret).update(body).digest('hex');
            const res = await fetch(process.env.COOLIFY_WEBHOOK_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-GitHub-Event': context.eventName,
                'X-Hub-Signature-256': `sha256=${hmac}`,
                'User-Agent': 'conference-capture-coolify-forwarder',
              },
              body,
            });
            const text = await res.text();
            console.log(res.status, text);
            if (!res.ok) throw new Error(`Coolify webhook ${res.status}: ${text}`);
